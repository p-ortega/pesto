[project]
name = "pesto"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "flopy>=3.9.5",
    "pyemu>=1.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.28",
]

[project.scripts]
pesto = "pesto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pesto"]
# The compiled frontend is gitignored, so it needs listing here to reach the
# wheel. Unlike force-include, artifacts tolerates it being absent, which is the
# normal case for an editable install or a test run.
artifacts = ["src/pesto/static/**/*"]

# enable-by-default = true so hatchling actually calls initialize() on every
# build; the real gate is PESTO_BUILD_FRONTEND inside hatch_build.py itself.
# Setting this to false has the opposite effect from what it sounds like: it
# stops hatchling from calling the hook AT ALL unless a second, separate
# HATCH_BUILD_HOOKS_ENABLE env var is also set, which would make
# PESTO_BUILD_FRONTEND=1 alone silently build nothing.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
enable-by-default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: touches real fixture data outside the repository"]
